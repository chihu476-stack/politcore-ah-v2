name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - run: gradle build
      - name: Prepare jar
        run: cp build/libs/politcore-ah-2.0.0.jar politcore-ah.jar
      - uses: actions/upload-artifact@v4
        with:
          name: politcore-ah-jar
          path: politcore-ah.jar
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest politcore-ah.jar --title "latest" --notes "auto build"
